name: Build ECHO-1 APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Your Vercel address, e.g. https://echo-1-nu.vercel.app"
        required: true
        default: "https://echo-1-nu.vercel.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the project
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          mkdir -p app/www app/native
          cd app
          cat > package.json <<'EOF'
          {
            "name": "echo-1-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
            "devDependencies": { "@capacitor/cli": "^7.0.0" }
          }
          EOF
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.echo1.app',appName:'ECHO-1',webDir:'www',server:{url:process.env.ECHO_URL,androidScheme:'https'}},null,2))"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO-1</title>
          <body style="margin:0;height:100vh;display:grid;place-items:center;background:#0c0a1c;color:#f4f1ff;font-family:sans-serif;text-align:center">
          <p>Can't reach the server. Check your internet and reopen the app.</p></body>
          EOF
          cat > native/AlarmPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Sets a real alarm or timer in the phone's Clock app. Websites are not allowed to do this, a native app is. */
          @CapacitorPlugin(name = "Alarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                  if (hour == null || minute == null) { call.reject("hour and minute are required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Alarm"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              @PluginMethod
              public void timer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) { call.reject("seconds is required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Timer"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              private void start(PluginCall call, Intent i) {
                  try { getContext().startActivity(i); call.resolve(); }
                  catch (Exception e) { call.reject("No Clock app could handle this"); }
              }
          }
          EOF
          cat > native/LauncherPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Opens installed apps by package name, and store or other links. A website inside a WebView can't do this on its own. */
          @CapacitorPlugin(name = "Launcher")
          public class LauncherPlugin extends Plugin {

              private boolean view(String uri) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(uri)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      return true;
                  } catch (Exception e) { return false; }
              }

              /** Opens the app. If it is not installed, opens `fallback` if given, otherwise its Google Play page. */
              @PluginMethod
              public void launchPackage(PluginCall call) {
                  String pkg = call.getString("package");
                  String fallback = call.getString("fallback", "");
                  if (pkg == null || pkg.isEmpty()) { call.reject("package is required"); return; }
                  try {
                      Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                          call.resolve();
                          return;
                      }
                  } catch (Exception ignored) { }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  if (view("market://details?id=" + pkg) || view("https://play.google.com/store/apps/details?id=" + pkg)) { call.resolve(); return; }
                  call.reject("Could not open " + pkg);
              }

              /** Opens any link (market://, https://, a custom scheme). Falls back to `fallback` if nothing can open it. */
              @PluginMethod
              public void open(PluginCall call) {
                  String uri = call.getString("uri");
                  String fallback = call.getString("fallback", "");
                  if (uri == null || uri.isEmpty()) { call.reject("uri is required"); return; }
                  if (view(uri)) { call.resolve(); return; }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  call.reject("Nothing could open this link");
              }
          }
          EOF
          cat > native/AssistPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Hands what you said or typed in the assistant bubble over to the ECHO-1 web app, and helps set ECHO-1 as the phone's assistant. */
          @CapacitorPlugin(name = "Assist")
          public class AssistPlugin extends Plugin {
              static volatile String pending = "";

              @PluginMethod
              public void takeQuery(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("text", pending == null ? "" : pending);
                  pending = "";
                  call.resolve(r);
              }

              @PluginMethod
              public void isDefault(PluginCall call) {
                  boolean yes = false;
                  try {
                      String s = Settings.Secure.getString(getContext().getContentResolver(), "assistant");
                      yes = s != null && s.contains(getContext().getPackageName());
                  } catch (Exception ignored) { }
                  JSObject r = new JSObject();
                  r.put("value", yes);
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String[] actions = { Settings.ACTION_VOICE_INPUT_SETTINGS, Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS, Settings.ACTION_SETTINGS };
                  for (String a : actions) {
                      try {
                          getContext().startActivity(new Intent(a).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          call.resolve();
                          return;
                      } catch (Exception ignored) { }
                  }
                  call.reject("Could not open settings");
              }

              @PluginMethod
              public void canOverlay(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("value", Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              @PluginMethod
              public void requestOverlay(PluginCall call) {
                  try {
                      getContext().startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getContext().getPackageName()))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      call.resolve();
                  } catch (Exception e) { call.reject("Could not open the permission page"); }
              }

              @PluginMethod
              public void showBubble(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(getContext())) { call.reject("Overlay permission is off"); return; }
                  try {
                      Intent i = new Intent(getContext(), BubbleService.class);
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i); else getContext().startService(i);
                      call.resolve();
                  } catch (Exception e) { call.reject("Could not start the bubble"); }
              }

              @PluginMethod
              public void hideBubble(PluginCall call) {
                  try { getContext().stopService(new Intent(getContext(), BubbleService.class)); } catch (Exception ignored) { }
                  call.resolve();
              }
          }
          EOF
          cat > native/BubbleService.java <<'EOF'
          package com.echo1.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.ImageView;

          /** A small ECHO-1 bubble that floats over other apps. Drag it anywhere. Tap it to ask. */
          public class BubbleService extends Service {
              private WindowManager wm;
              private View bubble;

              @Override public IBinder onBind(Intent i) { return null; }

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  goForeground();
                  if (bubble == null) addBubble();
                  return START_STICKY;
              }

              private void goForeground() {
                  String ch = "echo_bubble";
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null) {
                      nm.createNotificationChannel(new NotificationChannel(ch, "ECHO-1 bubble", NotificationManager.IMPORTANCE_MIN));
                  }
                  PendingIntent hide = PendingIntent.getService(this, 1, new Intent(this, BubbleService.class).setAction("STOP"),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                  nb.setContentTitle("ECHO-1 bubble is on")
                    .setContentText("Tap the bubble to ask. Tap here to hide it.")
                    .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                    .setContentIntent(hide)
                    .setOngoing(true);
                  Notification n = nb.build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(7, n);
              }

              private void addBubble() {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  int size = dp(56);
                  ImageView v = new ImageView(this);
                  v.setImageResource(R.drawable.echo_widget_icon);
                  v.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  v.setPadding(dp(3), dp(3), dp(3), dp(3));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(0xFF14101F);
                  bg.setStroke(dp(2), 0xFFC8F43A);
                  v.setBackground(bg);

                  final WindowManager.LayoutParams lp = new WindowManager.LayoutParams(size, size,
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = dp(12);
                  lp.y = dp(240);

                  v.setOnTouchListener(new View.OnTouchListener() {
                      float downX, downY; int startX, startY; boolean moved;
                      @Override public boolean onTouch(View view, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  downX = e.getRawX(); downY = e.getRawY(); startX = lp.x; startY = lp.y; moved = false; return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (Math.abs(e.getRawX() - downX) > dp(8) || Math.abs(e.getRawY() - downY) > dp(8)) moved = true;
                                  if (moved) {
                                      lp.x = startX + Math.round(e.getRawX() - downX);
                                      lp.y = startY + Math.round(e.getRawY() - downY);
                                      try { wm.updateViewLayout(bubble, lp); } catch (Exception ignored) { }
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) {
                                      try {
                                          startActivity(new Intent(BubbleService.this, AssistActivity.class)
                                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP));
                                      } catch (Exception ignored) { }
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });
                  bubble = v;
                  try { wm.addView(bubble, lp); } catch (Exception e) { bubble = null; stopSelf(); }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { if (wm != null && bubble != null) wm.removeView(bubble); } catch (Exception ignored) { }
                  bubble = null;
              }
          }
          EOF
          cat > native/AssistActivity.java <<'EOF'
          package com.echo1.app;

          import android.Manifest;
          import android.animation.ObjectAnimator;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.view.inputmethod.EditorInfo;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.ArrayList;

          /** The ECHO-1 bubble: speak or type, then ECHO-1 opens and answers. Styled like the ECHO-1 app (deep violet, lime accent). */
          public class AssistActivity extends Activity implements RecognitionListener {
              // ECHO-1 app colours
              private static final int CARD = 0xFF150F2B, INK = 0xFFF4F1FF, INK2 = 0x9EF4F1FF, LINE = 0x24FFFFFF, FIELD = 0x14FFFFFF;
              private static final int ACCENT = 0xFFC8F43A, ACCENT2 = 0xFF7B5CFF, ON_ACCENT = 0xFF14101F;
              private static final int REQ_MIC = 7, REQ_DIALOG = 8;

              private SpeechRecognizer rec;
              private EditText input;
              private TextView status;
              private IconView orb;
              private View halo;
              private LinearLayout card;
              private ObjectAnimator pulse;
              private boolean listening = false;
              private int attempt = 0;   // 0 = Google's speech engine, 1 = the phone's default engine, 2 = the phone's own voice window
              private final Handler h = new Handler(Looper.getMainLooper());

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              private GradientDrawable oval(int fill, int stroke, int strokeDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(fill);
                  if (strokeDp > 0) g.setStroke(dp(strokeDp), stroke);
                  return g;
              }

              /** Small icons drawn in code, so the bubble needs no image files. */
              static class IconView extends View {
                  static final int MIC = 0, STOP = 1, SEND = 2;
                  private int kind;
                  private final int color;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path path = new Path();
                  private final RectF rf = new RectF();

                  IconView(Context c, int kind, int color) { super(c); this.kind = kind; this.color = color; }

                  void setKind(int k) { kind = k; invalidate(); }

                  @Override
                  protected void onDraw(Canvas cv) {
                      float w = getWidth(), hh = getHeight(), s = Math.min(w, hh), cx = w / 2f, cy = hh / 2f;
                      p.setColor(color);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeJoin(Paint.Join.ROUND);
                      if (kind == STOP) {
                          p.setStyle(Paint.Style.FILL);
                          rf.set(cx - s * 0.15f, cy - s * 0.15f, cx + s * 0.15f, cy + s * 0.15f);
                          cv.drawRoundRect(rf, s * 0.05f, s * 0.05f, p);
                          return;
                      }
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(s * 0.075f);
                      if (kind == SEND) {
                          path.reset();
                          path.moveTo(cx, cy + s * 0.2f);
                          path.lineTo(cx, cy - s * 0.2f);
                          path.moveTo(cx - s * 0.17f, cy - s * 0.03f);
                          path.lineTo(cx, cy - s * 0.2f);
                          path.lineTo(cx + s * 0.17f, cy - s * 0.03f);
                          cv.drawPath(path, p);
                          return;
                      }
                      rf.set(cx - s * 0.1f, cy - s * 0.27f, cx + s * 0.1f, cy + s * 0.07f);
                      cv.drawRoundRect(rf, s * 0.1f, s * 0.1f, p);
                      rf.set(cx - s * 0.19f, cy - s * 0.12f, cx + s * 0.19f, cy + s * 0.2f);
                      cv.drawArc(rf, 0, 180, false, p);
                      cv.drawLine(cx, cy + s * 0.2f, cx, cy + s * 0.29f, p);
                      cv.drawLine(cx - s * 0.1f, cy + s * 0.29f, cx + s * 0.1f, cy + s * 0.29f, p);
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  try { getWindow().setNavigationBarColor(CARD); } catch (Exception ignored) { }

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x99000000);
                  root.setOnClickListener(v -> finish());

                  card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(20), dp(12), dp(20), dp(22));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(CARD);
                  bg.setStroke(dp(1), LINE);
                  float r = dp(28);
                  bg.setCornerRadii(new float[] { r, r, r, r, 0, 0, 0, 0 });
                  card.setBackground(bg);
                  card.setClickable(true);
                  root.addView(card, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM));

                  // The card sits above the phone's navigation bar and the keyboard, so nothing is cut off.
                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      int bottom;
                      if (Build.VERSION.SDK_INT >= 30) bottom = insets.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.ime()).bottom;
                      else bottom = insets.getSystemWindowInsetBottom();
                      card.setPadding(dp(20), dp(12), dp(20), dp(22) + bottom);
                      return insets;
                  });

                  View handle = new View(this);
                  GradientDrawable hg = new GradientDrawable();
                  hg.setColor(0x33F4F1FF);
                  hg.setCornerRadius(dp(2));
                  handle.setBackground(hg);
                  LinearLayout.LayoutParams hlp = new LinearLayout.LayoutParams(dp(40), dp(4));
                  hlp.gravity = Gravity.CENTER_HORIZONTAL;
                  hlp.bottomMargin = dp(16);
                  card.addView(handle, hlp);

                  TextView title = new TextView(this);
                  title.setText("ECHO-1");
                  title.setTextColor(ACCENT);
                  title.setTextSize(13);
                  title.setLetterSpacing(0.14f);
                  title.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  card.addView(title);

                  status = new TextView(this);
                  status.setText("Listening…");
                  status.setTextColor(INK);
                  status.setTextSize(19);
                  status.setTypeface(Typeface.create("sans-serif", Typeface.NORMAL));
                  status.setPadding(0, dp(6), 0, dp(16));
                  card.addView(status);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  card.addView(row);

                  input = new EditText(this);
                  input.setHint("Type or tap the mic");
                  input.setHintTextColor(INK2);
                  input.setTextColor(INK);
                  input.setHighlightColor(0x557B5CFF);
                  input.setTextSize(16);
                  input.setSingleLine(true);
                  input.setImeOptions(EditorInfo.IME_ACTION_SEND);
                  input.setPadding(dp(18), 0, dp(18), 0);
                  GradientDrawable ig = new GradientDrawable();
                  ig.setColor(FIELD);
                  ig.setStroke(dp(1), LINE);
                  ig.setCornerRadius(dp(26));
                  input.setBackground(ig);
                  input.setOnEditorActionListener((v, a, e) -> { submit(); return true; });
                  row.addView(input, new LinearLayout.LayoutParams(0, dp(52), 1f));

                  FrameLayout orbBox = new FrameLayout(this);
                  LinearLayout.LayoutParams olp = new LinearLayout.LayoutParams(dp(58), dp(58));
                  olp.leftMargin = dp(8);
                  row.addView(orbBox, olp);
                  halo = new View(this);
                  halo.setBackground(oval(0x667B5CFF, 0, 0));
                  halo.setVisibility(View.INVISIBLE);
                  orbBox.addView(halo, new FrameLayout.LayoutParams(dp(48), dp(48), Gravity.CENTER));
                  orb = new IconView(this, IconView.MIC, INK);
                  orb.setBackground(oval(ACCENT2, LINE, 1));
                  orb.setOnClickListener(v -> { if (listening) stopListening(); else startListening(); });
                  orbBox.addView(orb, new FrameLayout.LayoutParams(dp(48), dp(48), Gravity.CENTER));

                  IconView send = new IconView(this, IconView.SEND, ON_ACCENT);
                  send.setBackground(oval(ACCENT, 0, 0));
                  send.setOnClickListener(v -> submit());
                  LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(dp(48), dp(48));
                  slp.leftMargin = dp(2);
                  row.addView(send, slp);

                  setContentView(root);
                  root.post(this::startListening);
              }

              private void setStatus(String s) { status.setText(s); }

              private void setListeningUi(boolean on) {
                  listening = on;
                  orb.setKind(on ? IconView.STOP : IconView.MIC);
                  orb.setBackground(on ? oval(ACCENT2, ACCENT, 2) : oval(ACCENT2, LINE, 1));
                  if (on) {
                      halo.setVisibility(View.VISIBLE);
                      if (pulse == null) {
                          pulse = ObjectAnimator.ofFloat(halo, "alpha", 0.25f, 1f);
                          pulse.setDuration(900);
                          pulse.setRepeatCount(ObjectAnimator.INFINITE);
                          pulse.setRepeatMode(ObjectAnimator.REVERSE);
                      }
                      pulse.start();
                  } else {
                      if (pulse != null) pulse.cancel();
                      halo.setVisibility(View.INVISIBLE);
                      halo.setScaleX(1f);
                      halo.setScaleY(1f);
                  }
              }

              private void startListening() {
                  if (isFinishing() || listening) return;
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[] { Manifest.permission.RECORD_AUDIO }, REQ_MIC);
                      return;
                  }
                  if (attempt >= 2 || !SpeechRecognizer.isRecognitionAvailable(this)) { openVoiceWindow(); return; }
                  try {
                      makeRecognizer(attempt == 1);
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          .putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                      setStatus("Listening…");
                      setListeningUi(true);
                      rec.startListening(i);
                  } catch (Exception e) {
                      setListeningUi(false);
                      nextEngine();
                  }
              }

              private void destroyRecognizer() {
                  if (rec != null) {
                      try { rec.cancel(); } catch (Exception ignored) { }
                      try { rec.destroy(); } catch (Exception ignored) { }
                      rec = null;
                  }
              }

              private void makeRecognizer(boolean useDefault) {
                  destroyRecognizer();   // a fresh one every time avoids "too many requests" (code 10)
                  if (!useDefault) {
                      try {
                          // If ECHO-1 is the assistant, Android's default speech engine can point back at ECHO-1. Ask Google's directly.
                          rec = SpeechRecognizer.createSpeechRecognizer(this,
                              new ComponentName("com.google.android.googlequicksearchbox", "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"));
                      } catch (Exception ignored) { rec = null; }
                  }
                  if (rec == null) rec = SpeechRecognizer.createSpeechRecognizer(this);
                  rec.setRecognitionListener(this);
              }

              /** The speech engine had a problem: try the next way of listening. */
              private void nextEngine() {
                  attempt++;
                  destroyRecognizer();
                  if (attempt >= 2) { openVoiceWindow(); return; }
                  setStatus("One moment…");
                  h.postDelayed(this::startListening, 700);
              }

              /** Last resort that works on almost every phone: the phone's own voice window. */
              private void openVoiceWindow() {
                  try {
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_PROMPT, "Say it to ECHO-1");
                      startActivityForResult(i, REQ_DIALOG);
                  } catch (ActivityNotFoundException e) {
                      setStatus("Voice isn't available on this phone. Type instead.");
                  } catch (Exception e) {
                      setStatus("Voice isn't available right now. Type instead.");
                  }
              }

              private void stopListening() {
                  setListeningUi(false);
                  try { if (rec != null) rec.stopListening(); } catch (Exception ignored) { }
              }

              private void submit() {
                  String q = input.getText().toString().trim();
                  if (q.isEmpty()) { setStatus("Say or type something first."); return; }
                  Intent i = new Intent(this, MainActivity.class)
                      .putExtra("echo_query", q)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(i);
                  finish();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) startListening();
                  else setStatus("Mic permission is off. Type instead, or allow it in Settings.");
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  super.onActivityResult(code, result, data);
                  if (code != REQ_DIALOG) return;
                  ArrayList<String> list = (result == RESULT_OK && data != null) ? data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS) : null;
                  if (list != null && !list.isEmpty()) { input.setText(list.get(0)); submit(); }
                  else setStatus("Didn't catch that. Tap the mic to try again.");
              }

              @Override
              public void onResults(Bundle results) {
                  setListeningUi(false);
                  ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) { input.setText(list.get(0)); submit(); }
                  else setStatus("Didn't catch that. Tap the mic to try again.");
              }

              @Override
              public void onPartialResults(Bundle partial) {
                  ArrayList<String> list = partial.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) { input.setText(list.get(0)); input.setSelection(input.getText().length()); }
              }

              @Override
              public void onError(int error) {
                  setListeningUi(false);
                  if (error == SpeechRecognizer.ERROR_NO_MATCH || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) { setStatus("Didn't catch that. Tap the mic to try again."); return; }
                  if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { setStatus("Mic permission is off. Type instead."); return; }
                  if (error == SpeechRecognizer.ERROR_NETWORK || error == SpeechRecognizer.ERROR_NETWORK_TIMEOUT) { setStatus("No internet for voice. Type instead."); return; }
                  if (error == SpeechRecognizer.ERROR_AUDIO) { setStatus("The microphone is busy. Close other apps using it and try again."); return; }
                  nextEngine();   // engine problems (codes 4, 5, 8, 10, 11, 12, 13 ...): switch engine instead of giving up
              }

              @Override
              public void onRmsChanged(float rms) {
                  if (!listening) return;
                  float lvl = Math.max(0f, Math.min(10f, rms)) / 10f;
                  halo.setScaleX(1f + 0.16f * lvl);
                  halo.setScaleY(1f + 0.16f * lvl);
              }

              @Override public void onReadyForSpeech(Bundle p) { }
              @Override public void onBeginningOfSpeech() { }
              @Override public void onBufferReceived(byte[] buf) { }
              @Override public void onEndOfSpeech() { }
              @Override public void onEvent(int type, Bundle p) { }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  h.removeCallbacksAndMessages(null);
                  if (pulse != null) pulse.cancel();
                  destroyRecognizer();
              }
          }
