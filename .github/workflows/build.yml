name: Build ECHO-1 APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Your Vercel address, e.g. https://echo-1-nu.vercel.app"
        required: true
        default: "https://echo-1-nu.vercel.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the project
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          mkdir -p app/www app/native
          cd app
          cat > package.json <<'EOF'
          {
            "name": "echo-1-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
            "devDependencies": { "@capacitor/cli": "^7.0.0" }
          }
          EOF
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.echo1.app',appName:'ECHO-1',webDir:'www',server:{url:process.env.ECHO_URL,androidScheme:'https'}},null,2))"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO-1</title>
          <body style="margin:0;height:100vh;display:grid;place-items:center;background:#0c0a1c;color:#f4f1ff;font-family:sans-serif;text-align:center">
          <p>Can't reach the server. Check your internet and reopen the app.</p></body>
          EOF
          cat > native/AlarmPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Sets a real alarm or timer in the phone's Clock app. Websites are not allowed to do this, a native app is. */
          @CapacitorPlugin(name = "Alarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                  if (hour == null || minute == null) { call.reject("hour and minute are required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Alarm"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              @PluginMethod
              public void timer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) { call.reject("seconds is required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Timer"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              private void start(PluginCall call, Intent i) {
                  try { getContext().startActivity(i); call.resolve(); }
                  catch (Exception e) { call.reject("No Clock app could handle this"); }
              }
          }
          EOF
          cat > native/LauncherPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Opens installed apps by package name, and store or other links. A website inside a WebView can't do this on its own. */
          @CapacitorPlugin(name = "Launcher")
          public class LauncherPlugin extends Plugin {

              private boolean view(String uri) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(uri)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      return true;
                  } catch (Exception e) { return false; }
              }

              /** Opens the app. If it is not installed, opens `fallback` if given, otherwise its Google Play page. */
              @PluginMethod
              public void launchPackage(PluginCall call) {
                  String pkg = call.getString("package");
                  String fallback = call.getString("fallback", "");
                  if (pkg == null || pkg.isEmpty()) { call.reject("package is required"); return; }
                  try {
                      Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                          call.resolve();
                          return;
                      }
                  } catch (Exception ignored) { }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  if (view("market://details?id=" + pkg) || view("https://play.google.com/store/apps/details?id=" + pkg)) { call.resolve(); return; }
                  call.reject("Could not open " + pkg);
              }

              /** Opens any link (market://, https://, a custom scheme). Falls back to `fallback` if nothing can open it. */
              @PluginMethod
              public void open(PluginCall call) {
                  String uri = call.getString("uri");
                  String fallback = call.getString("fallback", "");
                  if (uri == null || uri.isEmpty()) { call.reject("uri is required"); return; }
                  if (view(uri)) { call.resolve(); return; }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  call.reject("Nothing could open this link");
              }
          }
          EOF
          cat > native/AssistPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Hands what you said or typed in the assistant bubble over to the ECHO-1 web app, and helps set ECHO-1 as the phone's assistant. */
          @CapacitorPlugin(name = "Assist")
          public class AssistPlugin extends Plugin {
              static volatile String pending = "";

              @PluginMethod
              public void takeQuery(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("text", pending == null ? "" : pending);
                  pending = "";
                  call.resolve(r);
              }

              @PluginMethod
              public void isDefault(PluginCall call) {
                  boolean yes = false;
                  try {
                      String s = Settings.Secure.getString(getContext().getContentResolver(), "assistant");
                      yes = s != null && s.contains(getContext().getPackageName());
                  } catch (Exception ignored) { }
                  JSObject r = new JSObject();
                  r.put("value", yes);
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String[] actions = { Settings.ACTION_VOICE_INPUT_SETTINGS, Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS, Settings.ACTION_SETTINGS };
                  for (String a : actions) {
                      try {
                          getContext().startActivity(new Intent(a).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          call.resolve();
                          return;
                      } catch (Exception ignored) { }
                  }
                  call.reject("Could not open settings");
              }
          }
          EOF
          cat > native/AssistActivity.java <<'EOF'
          package com.echo1.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.inputmethod.EditorInfo;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.ArrayList;

          /** The ECHO-1 bubble: speak or type, then ECHO-1 opens and answers. */
          public class AssistActivity extends Activity implements RecognitionListener {
              private SpeechRecognizer rec;
              private EditText input;
              private TextView status, mic;
              private boolean listening = false, triedDefault = false;

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              private TextView circle(String label, int color) {
                  TextView t = new TextView(this);
                  t.setText(label);
                  t.setTextSize(20);
                  t.setGravity(Gravity.CENTER);
                  t.setTextColor(Color.WHITE);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  t.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(48), dp(48));
                  lp.leftMargin = dp(8);
                  t.setLayoutParams(lp);
                  return t;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0x88000000);
                  root.setOnClickListener(v -> finish());

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(20), dp(18), dp(20), dp(22));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF1A1633);
                  float r = dp(28);
                  bg.setCornerRadii(new float[] { r, r, r, r, 0, 0, 0, 0 });
                  card.setBackground(bg);
                  card.setClickable(true);
                  root.addView(card, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM));

                  TextView title = new TextView(this);
                  title.setText("ECHO-1");
                  title.setTextColor(0xFF8FA81F);
                  title.setTextSize(14);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(title);

                  status = new TextView(this);
                  status.setText("Listening…");
                  status.setTextColor(0xFFF4F1FF);
                  status.setTextSize(18);
                  status.setPadding(0, dp(8), 0, dp(12));
                  card.addView(status);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  card.addView(row);

                  input = new EditText(this);
                  input.setHint("Type or tap the mic");
                  input.setHintTextColor(0x88F4F1FF);
                  input.setTextColor(0xFFF4F1FF);
                  input.setSingleLine(true);
                  input.setImeOptions(EditorInfo.IME_ACTION_SEND);
                  input.setOnEditorActionListener((v, a, e) -> { submit(); return true; });
                  row.addView(input, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  mic = circle("🎤", 0xFF4B3FA0);
                  mic.setOnClickListener(v -> { if (listening) stopListening(); else startListening(); });
                  row.addView(mic);

                  TextView send = circle("➤", 0xFF8FA81F);
                  send.setOnClickListener(v -> submit());
                  row.addView(send);

                  setContentView(root);
                  root.post(this::startListening);
              }

              private void startListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[] { Manifest.permission.RECORD_AUDIO }, 7);
                      return;
                  }
                  try {
                      if (rec == null) makeRecognizer(false);
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                      listening = true;
                      status.setText("Listening…");
                      mic.setText("■");
                      rec.startListening(i);
                  } catch (Exception e) {
                      listening = false;
                      mic.setText("🎤");
                      status.setText("Voice isn't available. Type instead.");
                  }
              }

              private void makeRecognizer(boolean useDefault) {
                  if (rec != null) { rec.destroy(); rec = null; }
                  if (!useDefault) {
                      try {
                          // If ECHO-1 is the assistant, Android's default speech engine can point back at ECHO-1. Ask Google's directly.
                          rec = SpeechRecognizer.createSpeechRecognizer(this,
                              new ComponentName("com.google.android.googlequicksearchbox", "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"));
                      } catch (Exception ignored) { rec = null; }
                  }
                  if (rec == null) rec = SpeechRecognizer.createSpeechRecognizer(this);
                  rec.setRecognitionListener(this);
              }

              private void stopListening() {
                  listening = false;
                  mic.setText("🎤");
                  try { if (rec != null) rec.stopListening(); } catch (Exception ignored) { }
              }

              private void submit() {
                  String q = input.getText().toString().trim();
                  if (q.isEmpty()) { status.setText("Say or type something first."); return; }
                  Intent i = new Intent(this, MainActivity.class)
                      .putExtra("echo_query", q)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(i);
                  finish();
              }

              @Override public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) startListening();
                  else status.setText("Mic permission is off. Type instead, or allow it in Settings.");
              }

              @Override public void onResults(Bundle results) {
                  listening = false;
                  mic.setText("🎤");
                  ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) { input.setText(list.get(0)); submit(); }
                  else status.setText("Didn't catch that. Tap the mic to try again.");
              }

              @Override public void onPartialResults(Bundle partial) {
                  ArrayList<String> list = partial.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) { input.setText(list.get(0)); input.setSelection(input.getText().length()); }
              }

              @Override public void onError(int error) {
                  listening = false;
                  mic.setText("🎤");
                  if ((error == SpeechRecognizer.ERROR_CLIENT || error == 11) && !triedDefault) {   // Google's engine not reachable: try the phone's default once
                      triedDefault = true;
                      try { makeRecognizer(true); startListening(); return; } catch (Exception ignored) { }
                  }
                  if (error == SpeechRecognizer.ERROR_NO_MATCH || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) status.setText("Didn't catch that. Tap the mic to try again.");
                  else if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) status.setText("Mic permission is off. Type instead.");
                  else status.setText("Voice problem (code " + error + "). Type instead.");
              }

              @Override public void onReadyForSpeech(Bundle p) { }
              @Override public void onBeginningOfSpeech() { }
              @Override public void onRmsChanged(float rms) { }
              @Override public void onBufferReceived(byte[] buf) { }
              @Override public void onEndOfSpeech() { }
              @Override public void onEvent(int type, Bundle p) { }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  try { if (rec != null) rec.destroy(); } catch (Exception ignored) { }
              }
          }
          EOF
          cat > native/EchoAssistService.java <<'EOF'
          package com.echo1.app;

          import android.service.voice.VoiceInteractionService;

          /** Makes ECHO-1 show up under Settings > Default apps > Digital assistant app. */
          public class EchoAssistService extends VoiceInteractionService { }
          EOF
          cat > native/EchoSessionService.java <<'EOF'
          package com.echo1.app;

          import android.os.Bundle;
          import android.service.voice.VoiceInteractionSession;
          import android.service.voice.VoiceInteractionSessionService;

          public class EchoSessionService extends VoiceInteractionSessionService {
              @Override
              public VoiceInteractionSession onNewSession(Bundle args) {
                  return new EchoSession(this);
              }
          }
          EOF
          cat > native/EchoSession.java <<'EOF'
          package com.echo1.app;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.voice.VoiceInteractionSession;

          /** Runs when you hold Home (or the power button). Opens the ECHO-1 bubble. */
          public class EchoSession extends VoiceInteractionSession {
              public EchoSession(Context context) { super(context); }

              @Override
              public void onShow(Bundle args, int showFlags) {
                  super.onShow(args, showFlags);
                  Intent i = new Intent(getContext(), AssistActivity.class)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  try { startAssistantActivity(i); }
                  catch (Exception e) { try { getContext().startActivity(i); } catch (Exception ignored) { } }
                  new Handler(Looper.getMainLooper()).postDelayed(this::hide, 400);
              }
          }
          EOF
          cat > native/EchoRecognitionService.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.speech.RecognitionService;
          import android.speech.SpeechRecognizer;

          /** Android wants every assistant to declare a recognition service. The bubble uses Google's speech engine instead. */
          public class EchoRecognitionService extends RecognitionService {
              @Override protected void onStartListening(Intent intent, Callback callback) {
                  try { callback.error(SpeechRecognizer.ERROR_CLIENT); } catch (Exception ignored) { }
              }
              @Override protected void onCancel(Callback callback) { }
              @Override protected void onStopListening(Callback callback) { }
          }
          EOF
          cat > native/patch-android.js <<'EOF'
          // Run after `cap add android`. Copies the native plugins in, registers them, adds the assistant bubble, and adds the permissions ECHO-1 needs. Safe to run again.
          const fs = require("fs"), path = require("path");
          const root = path.join(__dirname, "..", "android", "app", "src", "main");
          const pkgDir = path.join(root, "java", "com", "echo1", "app");
          if (!fs.existsSync(root)) { console.error("Run `npx cap add android` first."); process.exit(1); }
          fs.mkdirSync(pkgDir, { recursive: true });
          ["AlarmPlugin", "LauncherPlugin", "AssistPlugin", "AssistActivity", "EchoAssistService", "EchoSessionService", "EchoSession", "EchoRecognitionService"]
            .forEach((f) => fs.copyFileSync(path.join(__dirname, f + ".java"), path.join(pkgDir, f + ".java")));
          fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), `package com.echo1.app;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmPlugin.class);
                  registerPlugin(LauncherPlugin.class);
                  registerPlugin(AssistPlugin.class);
                  super.onCreate(savedInstanceState);
                  takeAssist(getIntent(), false);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  takeAssist(intent, true);
              }

              // The assistant bubble sends what you said here. The web app picks it up and answers.
              private void takeAssist(Intent i, boolean live) {
                  if (i == null) return;
                  String q = i.getStringExtra("echo_query");
                  if (q == null || q.trim().isEmpty()) return;
                  i.removeExtra("echo_query");
                  AssistPlugin.pending = q.trim();
                  if (live && getBridge() != null) getBridge().triggerDocumentJSEvent("echoassist");
              }
          }
          `);

          const resDir = path.join(root, "res");
          fs.mkdirSync(path.join(resDir, "xml"), { recursive: true });
          fs.mkdirSync(path.join(resDir, "values"), { recursive: true });
          fs.writeFileSync(path.join(resDir, "xml", "echo_assistant.xml"), `<?xml version="1.0" encoding="utf-8"?>
          <voice-interaction-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:sessionService="com.echo1.app.EchoSessionService"
              android:recognitionService="com.echo1.app.EchoRecognitionService"
              android:supportsAssist="true"
              android:supportsLaunchVoiceAssistFromKeyguard="true" />
          `);
          fs.writeFileSync(path.join(resDir, "xml", "echo_recognizer.xml"), `<?xml version="1.0" encoding="utf-8"?>
          <recognition-service xmlns:android="http://schemas.android.com/apk/res/android" />
          `);
          fs.writeFileSync(path.join(resDir, "values", "echo_styles.xml"), `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="EchoBubble" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowAnimationStyle">@android:style/Animation.Activity</item>
              </style>
          </resources>
          `);

          const mf = path.join(root, "AndroidManifest.xml");
          let x = fs.readFileSync(mf, "utf8");
          ["android.permission.INTERNET", "android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS",
           "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION",
           "android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE", "com.android.alarm.permission.SET_ALARM"
          ].forEach((p) => { if (!x.includes('"' + p + '"')) x = x.replace("</manifest>", '    <uses-permission android:name="' + p + '" />\n</manifest>'); });
          // Lets the app see and open other installed apps, and find the speech engine (Android 11+ hides them otherwise).
          if (!x.includes("<queries>")) x = x.replace("<application", '<queries>\n        <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n    </queries>\n\n    <application');
          // The assistant: shows ECHO-1 in Settings > Digital assistant app, and opens the bubble.
          if (!x.includes(".EchoAssistService")) {
            x = x.replace("</application>", `
                  <service android:name=".EchoAssistService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true">
                      <meta-data android:name="android.voice_interaction" android:resource="@xml/echo_assistant" />
                      <intent-filter><action android:name="android.service.voice.VoiceInteractionService" /></intent-filter>
                  </service>
                  <service android:name=".EchoSessionService" android:permission="android.permission.BIND_VOICE_INTERACTION" android:exported="true" />
                  <service android:name=".EchoRecognitionService" android:exported="true">
                      <intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>
                      <meta-data android:name="android.speech" android:resource="@xml/echo_recognizer" />
                  </service>
                  <activity android:name=".AssistActivity" android:theme="@style/EchoBubble" android:exported="true" android:excludeFromRecents="true"
                      android:launchMode="singleTask" android:taskAffinity="" android:windowSoftInputMode="adjustResize" />
              </application>`);
          }
          fs.writeFileSync(mf, x);
          console.log("Android project patched: alarm, launcher, assistant bubble + permissions.");
          EOF
          cat > native/make-icons.py <<'EOF'
          # Builds the Android launcher icons from the ECHO-1 icons on your website. Usage: python3 make-icons.py https://your-site
          import io, os, sys, urllib.request
          from PIL import Image, ImageDraw

          base = sys.argv[1].rstrip("/")
          res = os.path.join("android", "app", "src", "main", "res")

          def get(name):
              with urllib.request.urlopen(base + "/" + name, timeout=30) as r:
                  return Image.open(io.BytesIO(r.read())).convert("RGBA")

          icon, mask = get("icon-512.png"), get("icon-maskable-512.png")
          bg = icon.getpixel((2, 2))[:3]
          hexbg = "#%02X%02X%02X" % bg

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in legacy.items():
              out = os.path.join(res, "mipmap-" + d)
              os.makedirs(out, exist_ok=True)
              sq = icon.resize((px, px), Image.LANCZOS)
              sq.save(os.path.join(out, "ic_launcher.png"))
              m = Image.new("L", (px * 4, px * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
              rd = sq.copy(); rd.putalpha(m.resize((px, px), Image.LANCZOS))
              rd.save(os.path.join(out, "ic_launcher_round.png"))
              fg = mask.resize((px * 9 // 4, px * 9 // 4), Image.LANCZOS)      # adaptive icon layer is 108dp = 2.25 x the 48dp icon
              fg.save(os.path.join(out, "ic_launcher_foreground.png"))

          os.makedirs(os.path.join(res, "values"), exist_ok=True)
          open(os.path.join(res, "values", "ic_launcher_background.xml"), "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hexbg + '</color>\n</resources>\n')
          os.makedirs(os.path.join(res, "mipmap-anydpi-v26"), exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(res, "mipmap-anydpi-v26", n), "w").write(xml)
          print("ECHO-1 icons written, background", hexbg)
          EOF
      - name: Use the same signing key (so a new build installs over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "Using saved signing key"; else echo "No saved key. Uninstall the old app before installing this one."; fi
      - name: Build the Android app
        working-directory: app
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          npm install
          npx cap add android
          node native/patch-android.js
          pip install --quiet pillow
          python3 native/make-icons.py "$ECHO_URL" || echo "Icon step skipped, using the default icon"
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-1-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk ECHO-1.apk
          gh release create "v${{ github.run_number }}" ECHO-1.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ECHO-1 v${{ github.run_number }}" --notes "Install ECHO-1.apk on your Android phone." --latest
          echo "Download link: https://github.com/${{ github.repository }}/releases/latest/download/ECHO-1.apk"
