name: Build ECHO-1 APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Your Vercel address, e.g. https://my-echo.vercel.app"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the project
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          mkdir -p app/www app/native
          cd app
          cat > package.json <<'EOF'
          {
            "name": "echo-1-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
            "devDependencies": { "@capacitor/cli": "^7.0.0" }
          }
          EOF
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.echo1.app',appName:'ECHO-1',webDir:'www',server:{url:process.env.ECHO_URL,androidScheme:'https'}},null,2))"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO-1</title>
          <body style="margin:0;height:100vh;display:grid;place-items:center;background:#0c0a1c;color:#f4f1ff;font-family:sans-serif;text-align:center">
          <p>Can't reach the server. Check your internet and reopen the app.</p></body>
          EOF
          cat > native/AlarmPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Sets a real alarm or timer in the phone's Clock app. Websites are not allowed to do this, a native app is. */
          @CapacitorPlugin(name = "Alarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                  if (hour == null || minute == null) { call.reject("hour and minute are required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Alarm"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              @PluginMethod
              public void timer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) { call.reject("seconds is required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Timer"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              private void start(PluginCall call, Intent i) {
                  try { getContext().startActivity(i); call.resolve(); }
                  catch (Exception e) { call.reject("No Clock app could handle this"); }
              }
          }
          EOF
          cat > native/patch-android.js <<'EOF'
          // Run after `cap add android`. Copies the alarm plugin in, registers it, and adds the permissions ECHO-1 needs. Safe to run again.
          const fs = require("fs"), path = require("path");
          const root = path.join(__dirname, "..", "android", "app", "src", "main");
          const pkgDir = path.join(root, "java", "com", "echo1", "app");
          if (!fs.existsSync(root)) { console.error("Run `npx cap add android` first."); process.exit(1); }
          fs.mkdirSync(pkgDir, { recursive: true });
          fs.copyFileSync(path.join(__dirname, "AlarmPlugin.java"), path.join(pkgDir, "AlarmPlugin.java"));
          fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), `package com.echo1.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          `);
          const mf = path.join(root, "AndroidManifest.xml");
          let x = fs.readFileSync(mf, "utf8");
          ["android.permission.INTERNET", "android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS",
           "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION",
           "android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE", "com.android.alarm.permission.SET_ALARM"
          ].forEach((p) => { if (!x.includes('"' + p + '"')) x = x.replace("</manifest>", '    <uses-permission android:name="' + p + '" />\n</manifest>'); });
          fs.writeFileSync(mf, x);
          console.log("Android project patched: alarm plugin + permissions.");
          EOF
      - name: Build the Android app
        working-directory: app
        run: |
          npm install
          npx cap add android
          node native/patch-android.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-1-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
