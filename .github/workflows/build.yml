name: Build ECHO-1 APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Your Vercel address, e.g. https://echo-1-nu.vercel.app"
        required: true
        default: "https://echo-1-nu.vercel.app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the project
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          mkdir -p app/www app/native
          cd app
          cat > package.json <<'EOF'
          {
            "name": "echo-1-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
            "devDependencies": { "@capacitor/cli": "^7.0.0" }
          }
          EOF
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.echo1.app',appName:'ECHO-1',webDir:'www',server:{url:process.env.ECHO_URL,androidScheme:'https'}},null,2))"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO-1</title>
          <body style="margin:0;height:100vh;display:grid;place-items:center;background:#0c0a1c;color:#f4f1ff;font-family:sans-serif;text-align:center">
          <p>Can't reach the server. Check your internet and reopen the app.</p></body>
          EOF
          cat > native/AlarmPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Sets a real alarm or timer in the phone's Clock app. Websites are not allowed to do this, a native app is. */
          @CapacitorPlugin(name = "Alarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                  if (hour == null || minute == null) { call.reject("hour and minute are required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Alarm"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              @PluginMethod
              public void timer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) { call.reject("seconds is required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Timer"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              private void start(PluginCall call, Intent i) {
                  try { getContext().startActivity(i); call.resolve(); }
                  catch (Exception e) { call.reject("No Clock app could handle this"); }
              }
          }
          EOF
          cat > native/LauncherPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Opens installed apps by package name, and store or other links. A website inside a WebView can't do this on its own. */
          @CapacitorPlugin(name = "Launcher")
          public class LauncherPlugin extends Plugin {

              private boolean view(String uri) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(uri)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      return true;
                  } catch (Exception e) { return false; }
              }

              /** Opens the app. If it is not installed, opens `fallback` if given, otherwise its Google Play page. */
              @PluginMethod
              public void launchPackage(PluginCall call) {
                  String pkg = call.getString("package");
                  String fallback = call.getString("fallback", "");
                  if (pkg == null || pkg.isEmpty()) { call.reject("package is required"); return; }
                  try {
                      Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                          call.resolve();
                          return;
                      }
                  } catch (Exception ignored) { }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  if (view("market://details?id=" + pkg) || view("https://play.google.com/store/apps/details?id=" + pkg)) { call.resolve(); return; }
                  call.reject("Could not open " + pkg);
              }

              /** Opens any link (market://, https://, a custom scheme). Falls back to `fallback` if nothing can open it. */
              @PluginMethod
              public void open(PluginCall call) {
                  String uri = call.getString("uri");
                  String fallback = call.getString("fallback", "");
                  if (uri == null || uri.isEmpty()) { call.reject("uri is required"); return; }
                  if (view(uri)) { call.resolve(); return; }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  call.reject("Nothing could open this link");
              }
          }
          EOF
          cat > native/patch-android.js <<'EOF'
          // Run after `cap add android`. Copies the alarm plugin in, registers it, and adds the permissions ECHO-1 needs. Safe to run again.
          const fs = require("fs"), path = require("path");
          const root = path.join(__dirname, "..", "android", "app", "src", "main");
          const pkgDir = path.join(root, "java", "com", "echo1", "app");
          if (!fs.existsSync(root)) { console.error("Run `npx cap add android` first."); process.exit(1); }
          fs.mkdirSync(pkgDir, { recursive: true });
          ["AlarmPlugin.java", "LauncherPlugin.java"].forEach((f) => fs.copyFileSync(path.join(__dirname, f), path.join(pkgDir, f)));
          fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), `package com.echo1.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmPlugin.class);
                  registerPlugin(LauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          `);
          const mf = path.join(root, "AndroidManifest.xml");
          let x = fs.readFileSync(mf, "utf8");
          ["android.permission.INTERNET", "android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS",
           "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION",
           "android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE", "com.android.alarm.permission.SET_ALARM"
          ].forEach((p) => { if (!x.includes('"' + p + '"')) x = x.replace("</manifest>", '    <uses-permission android:name="' + p + '" />\n</manifest>'); });
          // Lets the app see and open other installed apps (Android 11+ hides them otherwise).
          if (!x.includes("<queries>")) x = x.replace("<application", '<queries>\n        <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n    </queries>\n\n    <application');
          fs.writeFileSync(mf, x);
          console.log("Android project patched: alarm plugin + permissions.");
          EOF
          cat > native/make-icons.py <<'EOF'
          # Builds the Android launcher icons from the ECHO-1 icons on your website. Usage: python3 make-icons.py https://your-site
          import io, os, sys, urllib.request
          from PIL import Image, ImageDraw

          base = sys.argv[1].rstrip("/")
          res = os.path.join("android", "app", "src", "main", "res")

          def get(name):
              with urllib.request.urlopen(base + "/" + name, timeout=30) as r:
                  return Image.open(io.BytesIO(r.read())).convert("RGBA")

          icon, mask = get("icon-512.png"), get("icon-maskable-512.png")
          bg = icon.getpixel((2, 2))[:3]
          hexbg = "#%02X%02X%02X" % bg

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in legacy.items():
              out = os.path.join(res, "mipmap-" + d)
              os.makedirs(out, exist_ok=True)
              sq = icon.resize((px, px), Image.LANCZOS)
              sq.save(os.path.join(out, "ic_launcher.png"))
              m = Image.new("L", (px * 4, px * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
              rd = sq.copy(); rd.putalpha(m.resize((px, px), Image.LANCZOS))
              rd.save(os.path.join(out, "ic_launcher_round.png"))
              fg = mask.resize((px * 9 // 4, px * 9 // 4), Image.LANCZOS)      # adaptive icon layer is 108dp = 2.25 x the 48dp icon
              fg.save(os.path.join(out, "ic_launcher_foreground.png"))

          os.makedirs(os.path.join(res, "values"), exist_ok=True)
          open(os.path.join(res, "values", "ic_launcher_background.xml"), "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hexbg + '</color>\n</resources>\n')
          os.makedirs(os.path.join(res, "mipmap-anydpi-v26"), exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(res, "mipmap-anydpi-v26", n), "w").write(xml)
          print("ECHO-1 icons written, background", hexbg)
          EOF
      - name: Build the Android app
        working-directory: app
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          npm install
          npx cap add android
          node native/patch-android.js
          pip install --quiet pillow
          python3 native/make-icons.py "$ECHO_URL" || echo "Icon step skipped, using the default icon"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-1-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
